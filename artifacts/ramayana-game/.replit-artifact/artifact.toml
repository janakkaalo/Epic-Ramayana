kind = "web"
previewPath = "/"
title = "Ramayana 3D Action-RPG"
version = "1.0.0"
id = "artifacts/ramayana-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25635

[services.development]
run = "pnpm --filter @workspace/ramayana-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ramayana-game", "run", "build" ]
publicDir = "artifacts/ramayana-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25635"
BASE_PATH = "/"
